<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교안 요약 & 예상문제 생성기</title>
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--primary-color);
    }

    .file-drop-area {
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      padding: 30px;
      text-align: center;
      background-color: #fafafa;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .file-drop-area:hover, .file-drop-area.dragover {
      border-color: var(--primary-color);
      background-color: #f0fdf4;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #475569;
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .result-section {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .quiz-item {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .quiz-question {
      font-weight: 600;
      margin-bottom: 10px;
    }

    .quiz-options {
      list-style-type: none;
      margin-bottom: 10px;
    }

    .quiz-options li {
      padding: 6px 10px;
      margin-bottom: 4px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .quiz-answer {
      font-size: 0.9rem;
      color: #059669;
      font-weight: 600;
      margin-top: 8px;
    }

    .badge {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>교안 요약 & 예상문제 생성기</h1>
    <p>Gemini AI를 활용해 PDF 교안(스캔본 포함)을 요약하고 예상문제를 추출합니다.</p>
  </header>

  <!-- 1. API 키 설정 -->
  <div class="card">
    <div class="section-title">
      <span>Gemini API 키 설정</span>
      <span id="apiStatus" class="badge" style="display:none;">설정완료</span>
    </div>
    <div class="input-group">
      <input type="password" id="apiKeyInput" placeholder="Gemini API 키를 입력하세요">
      <button id="saveApiKeyBtn" onclick="saveApiKey()">저장</button>
      <button id="resetApiKeyBtn" onclick="resetApiKey()" class="btn-secondary" style="display:none;">변경</button>
    </div>
    <small style="color: #64748b;">* 입력한 API 키는 사용자의 브라우저(localStorage)에만 안전하게 저장됩니다.</small>
  </div>

  <!-- 2. PDF 업로드 및 실행 -->
  <div class="card">
    <div class="section-title">교안 PDF 업로드</div>
    <div class="file-drop-area" id="dropArea" onclick="document.getElementById('pdfInput').click()">
      <p id="fileLabel">여기를 클릭하거나 PDF 파일을 드래그하여 놓으세요.</p>
      <input type="file" id="pdfInput" accept=".pdf" style="display:none;" onchange="handleFileSelect(event)">
    </div>
    <button id="generateBtn" onclick="processPdf()" style="width: 100%; margin-top: 16px;" disabled>
      요약 및 예상문제 생성하기
    </button>
  </div>

  <!-- 로딩 표시 -->
  <div class="loading" id="loadingState">
    <div class="spinner"></div>
    <p id="loadingText">PDF 파일을 처리 중입니다...</p>
  </div>

  <!-- 3. 결과 출력 -->
  <div id="resultContainer" style="display: none;">
    <!-- 요약 결과 -->
    <div class="card">
      <div class="section-title">교안 주요 내용 요약</div>
      <div id="summaryResult" class="result-section"></div>
    </div>

    <!-- 예상문제 10문제 -->
    <div class="card">
      <div class="section-title">예상문제 (4지선다 10문항)</div>
      <div id="quizResult"></div>
    </div>
  </div>
</div>

<script>
  let selectedFile = null;

  // 페이지 로드시 API 키 확인
  window.onload = function() {
    const savedKey = localStorage.getItem('gemini_api_key');
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('apiKeyInput').disabled = true;
      document.getElementById('saveApiKeyBtn').style.display = 'none';
      document.getElementById('resetApiKeyBtn').style.display = 'inline-block';
      document.getElementById('apiStatus').style.display = 'inline-block';
    }
  };

  // API 키 저장
  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) {
      alert('API 키를 입력해주세요.');
      return;
    }
    localStorage.setItem('gemini_api_key', key);
    document.getElementById('apiKeyInput').disabled = true;
    document.getElementById('saveApiKeyBtn').style.display = 'none';
    document.getElementById('resetApiKeyBtn').style.display = 'inline-block';
    document.getElementById('apiStatus').style.display = 'inline-block';
    alert('API 키가 성공적으로 저장되었습니다.');
  }

  // API 키 변경/초기화
  function resetApiKey() {
    localStorage.removeItem('gemini_api_key');
    document.getElementById('apiKeyInput').value = '';
    document.getElementById('apiKeyInput').disabled = false;
    document.getElementById('saveApiKeyBtn').style.display = 'inline-block';
    document.getElementById('resetApiKeyBtn').style.display = 'none';
    document.getElementById('apiStatus').style.display = 'none';
  }

  // 파일 선택 처리
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (file && file.type === 'application/pdf') {
      selectedFile = file;
      document.getElementById('fileLabel').innerText = `선택된 파일: ${file.name}`;
      document.getElementById('generateBtn').disabled = false;
    } else {
      alert('PDF 파일만 업로드 가능합니다.');
    }
  }

  // 드래그 앤 드롭 이벤트
  const dropArea = document.getElementById('dropArea');
  ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, preventDefaults, false);
  });

  function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
  }

  dropArea.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const file = dt.files[0];
    if (file && file.type === 'application/pdf') {
      selectedFile = file;
      document.getElementById('fileLabel').innerText = `선택된 파일: ${file.name}`;
      document.getElementById('generateBtn').disabled = false;
    } else {
      alert('PDF 파일만 업로드 가능합니다.');
    }
  });

  // PDF 파일을 Base64로 변환하는 함수
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => {
        const base64String = reader.result.split(',')[1];
        resolve(base64String);
      };
      reader.onerror = error => reject(error);
    });
  }

  // PDF 처리 메인 함수
  async function processPdf() {
    const apiKey = localStorage.getItem('gemini_api_key');
    if (!apiKey) {
      alert('Gemini API 키를 먼저 설정해주세요.');
      return;
    }

    if (!selectedFile) {
      alert('PDF 파일을 선택해주세요.');
      return;
    }

    const loadingState = document.getElementById('loadingState');
    const loadingText = document.getElementById('loadingText');
    const resultContainer = document.getElementById('resultContainer');
    const generateBtn = document.getElementById('generateBtn');

    loadingState.style.display = 'block';
    resultContainer.style.display = 'none';
    generateBtn.disabled = true;

    try {
      loadingText.innerText = 'PDF 분석 및 Base64 인코딩 중...';
      const pdfBase64 = await fileToBase64(selectedFile);

      loadingText.innerText = 'Gemini AI가 PDF를 분석하여 요약 및 10문제를 생성하고 있습니다...';
      const aiResponse = await callGeminiWithPdf(apiKey, pdfBase64);

      renderResult(aiResponse);
      resultContainer.style.display = 'block';
    } catch (error) {
      alert(`오류 발생: ${error.message}`);
    } finally {
      loadingState.style.display = 'none';
      generateBtn.disabled = false;
    }
  }

  // Gemini API 호출 함수 (gemini-3.8-flash 적용)
  async function callGeminiWithPdf(apiKey, pdfBase64) {
    const prompt = `
당신은 최고의 교육 전문가입니다. 첨부된 교안 PDF 문서를 읽고 아래 두 가지 작업을 수행해주세요. 스캔된 이미지 문서이더라도 이미지 속 글자를 읽고 정확하게 파악하세요.

[작업 1: 주요 내용 요약]
- 전체 교안의 핵심 내용을 체계적으로 요약하세요.
- 불릿 포인트와 명확한 주제 제목을 사용해 읽기 쉽게 정리하세요.

[작업 2: 예상문제 추출 (4지선다 객관식 10문제)]
- 교안 내용을 기반으로 핵심을 점검할 수 있는 4지선다 객관식 문제 10개를 만드세요.
- 반드시 아래 제공하는 JSON 형식 구조로만 응답 결과를 작성해주세요.

응답 형식은 반드시 다음 JSON 구조를 맞춰서 작성하세요 (다른 서론이나 설명 문구는 제외):
{
  "summary": "요약된 내용을 마크다운/텍스트 형태로 작성",
  "quizzes": [
    {
      "id": 1,
      "question": "문제 내용",
      "options": ["1번 보기", "2번 보기", "3번 보기", "4번 보기"],
      "answer": "정답 보기 (예: 1번 보기)",
      "explanation": "해설 내용"
    }
  ]
}
    `;

    // 최신 모델인 gemini-3.8-flash 엔드포인트 적용
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`;

    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [
          {
            parts: [
              {
                inlineData: {
                  mimeType: "application/pdf",
                  data: pdfBase64
                }
              },
              { text: prompt }
            ]
          }
        ],
        generationConfig: {
          responseMimeType: "application/json"
        }
      })
    });

    if (!response.ok) {
      const errorData = await response.json();
      throw new Error(errorData.error?.message || 'Gemini API 호출에 실패했습니다.');
    }

    const data = await response.json();
    const resultText = data.candidates[0].content.parts[0].text;
    
    return JSON.parse(resultText);
  }

  // AI 응답 결과를 화면에 출력
  function renderResult(data) {
    // 요약 출력
    document.getElementById('summaryResult').innerText = data.summary;

    // 문제 출력
    const quizContainer = document.getElementById('quizResult');
    quizContainer.innerHTML = '';

    if (data.quizzes && Array.isArray(data.quizzes)) {
      data.quizzes.forEach((quiz, index) => {
        const quizDiv = document.createElement('div');
        quizDiv.className = 'quiz-item';

        const optionsList = quiz.options.map(opt => `<li>${opt}</li>`).join('');

        quizDiv.innerHTML = `
          <div class="quiz-question">Q${index + 1}. ${quiz.question}</div>
          <ul class="quiz-options">${optionsList}</ul>
          <div class="quiz-answer">✓ 정답: ${quiz.answer}</div>
          <div style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">해설: ${quiz.explanation}</div>
        `;

        quizContainer.appendChild(quizDiv);
      });
    }
  }
</script>

</body>
</html>
